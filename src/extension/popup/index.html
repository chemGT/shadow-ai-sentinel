<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow AI Sentinel</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #4f46e5;
        --ok: #047857;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        font-size: 13px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      .title {
        font-weight: 600;
        font-size: 14px;
      }
      .badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: #eef2ff;
        color: var(--accent);
      }
      section {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
      }
      .stats {
        display: flex;
        gap: 16px;
        margin-top: 8px;
        color: var(--muted);
      }
      .stats strong {
        color: var(--fg);
        font-size: 16px;
        display: block;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 12px;
        padding: 8px 10px;
      }
      .link {
        background: none;
        color: var(--accent);
        padding: 0;
        text-decoration: underline;
      }
      footer {
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .hidden {
        display: none;
      }
      .warning {
        background: #fff7ed;
        color: #7c2d12;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">Shadow AI Sentinel</span>
      <span class="badge">Open source</span>
    </header>

    <section>
      <div class="status">
        <span class="dot"></span>
        <span id="statusText">Protection active</span>
      </div>
      <div class="stats">
        <div><strong id="blockedCount">0</strong><span id="blockedLabel">bloqués</span></div>
        <div><strong id="redactedLabel">0</strong><span id="redactedText">caviardés</span></div>
      </div>
    </section>

    <section id="adapterHealthWarning" class="warning hidden">
      <span id="adapterHealthWarningText"></span>
    </section>

    <footer>
      <button id="optionsBtn" class="link"></button>
      <a id="sourceLink" class="link" href="https://github.com/chemGT/shadow-ai-sentinel" target="_blank" rel="noopener"></a>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
