name: Bug report
description: Something else does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Describe the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, OS, extension version
