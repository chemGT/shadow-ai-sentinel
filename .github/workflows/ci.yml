name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests
        run: npm run test:ci

      - name: Typecheck & Chromium extension build
        run: npm run build

      - name: Verify Chromium dist
        run: node scripts/verify-dist.mjs

      - name: Firefox extension build
        run: npm run build:firefox

      - name: Verify Firefox dist
        run: node scripts/verify-dist-firefox.mjs

      - name: API smoke tests
        run: npm run test:api
