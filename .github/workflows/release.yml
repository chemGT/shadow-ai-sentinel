name: Release

on:
  push:
    tags: ['v*.*.*']
  # Déclenchement manuel (onglet Actions → Release → Run workflow) depuis master : le workflow
  # crée lui-même le tag vX.Y.Z sur le commit courant. Un tag créé par GITHUB_TOKEN ne relance
  # pas ce workflow (pas de double release).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without "v" (must match manifests, package.json and a CHANGELOG section), e.g. 1.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Resolve release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "::error::manual releases must run from master (got $GITHUB_REF)"
              exit 1
            fi
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::invalid version '$INPUT_VERSION' (expected X.Y.Z)"
              exit 1
            fi
            TAG="v$INPUT_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::tag $TAG already exists"
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches manifest versions
        run: |
          for f in manifest.json manifest.firefox.json package.json; do
            V=$(node -p "require('./$f').version")
            if [ "$V" != "$VERSION" ]; then
              echo "::error file=$f::version $V != release $VERSION"
              exit 1
            fi
          done

      - name: Tests
        run: npm test

      - name: Build Chromium + Firefox
        run: |
          npm run build
          node scripts/verify-dist.mjs
          npm run build:firefox
          node scripts/verify-dist-firefox.mjs

      - name: Package
        # Chromium zip, xpi Firefox non signé, archive source (AMO), SHA256SUMS.txt → release/
        run: node scripts/package.mjs

      - name: Build provenance attestation
        # Attestations : dépôt public requis (ou GitHub Enterprise Cloud).
        if: github.event.repository.private != true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.zip, release/*.xpi'

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error file=CHANGELOG.md::no section for $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Crée le tag sur le commit testé et construit ci-dessus.
            TARGET=(--target "$GITHUB_SHA")
          else
            TARGET=(--verify-tag)
          fi
          gh release create "$TAG" release/* \
            --title "Shadow AI Sentinel $TAG" \
            --notes-file release-notes.md \
            "${TARGET[@]}"
